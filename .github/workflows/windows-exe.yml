# Builds Protolith.exe on Windows. On main it is published as the "Latest Windows build" release; on a
# pull request the exe is kept as a downloadable artifact of the run.
name: Windows exe

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "packaging/**", "pyproject.toml", ".github/workflows/windows-exe.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (the link and the shell; the full suite needs Reaction's reference data)
        run: |
          python -m pip install numpy scipy pytest
          python -m pytest -q tests/protolith
      - name: Build
        run: powershell -File packaging\protolith\build_exe.ps1
      - name: Check that it starts and every module answers
        run: dist\Protolith.exe --check
      - uses: actions/upload-artifact@v4
        with:
          name: Protolith-exe
          path: dist/Protolith.exe
      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag 2>$null
          gh release create windows-latest dist/Protolith.exe --target ${{ github.sha }} --title "Latest Windows build" --notes "Protolith.exe built from ${{ github.sha }}. Double-click to start; the home window opens in your browser."
