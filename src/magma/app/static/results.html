<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magma: results | Dougalien Systems</title>
<meta name="author" content="Dougalien Systems">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/magma_mark.svg">
<link rel="apple-touch-icon" href="/static/magma_512.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="bar">
  <img class="mark" src="/static/dougalien_mark.svg" alt="" width="26" height="26">
  <h1>Magma</h1>
  <a class="brand small" href="https://dougalien.com" target="_blank" rel="noopener" title="Visit dougalien.com (opens in your browser)">by Dougalien Systems</a>
  <span class="muted small">results</span>
  <span class="spacer"></span>
  <span id="pill-link" class="pill">connecting</span>
  <span id="pill-run" class="pill" style="display:none"></span>
</div>
<main class="results">
  <div id="empty" class="empty panel">
    <h2>No results yet</h2>
    <p>Set up a melt in the control window and press Run. The results appear here as each temperature step finishes.</p>
  </div>
  <div id="content" style="display:none;gap:14px;flex-direction:column">
    <section class="panel">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div>
          <h2 id="title"></h2>
          <div id="meta" class="small muted"></div>
        </div>
        <div class="row">
          <button id="dl-csv" title="Every step as a table">Download CSV</button>
          <button id="dl-svg" title="The plot as a vector image">Download plot</button>
        </div>
      </div>
      <div class="row small" id="sample-row" style="margin-top:8px;gap:6px" title="A sample file holds one step's melt and minerals with their compositions, for Reaction or another Protolith module to open">
        <span class="muted">Save a step as a sample:</span>
        <select id="smp-step" aria-label="Which step to save" style="width:auto"></select>
        <select id="smp-part" aria-label="What to keep" style="width:auto"><option value="all">melt and rock</option><option value="rock">rock only (melt left behind)</option></select>
        <button id="dl-sample">Save sample</button>
        <span id="send-box" hidden title="Put this step on Reaction's card as reactants: its rock as minerals, its melt as a glass of its oxides"><button id="send-sample">Send to Reaction</button>
          <input id="send-g" type="number" min="0" step="any" value="100" style="width:5em" aria-label="Grams per kg of water"> g</span>
        <span id="smp-note" class="muted"></span>
      </div>
      <h3 style="margin:12px 0 6px">Here is what we found</h3>
      <div id="story" class="story"></div>
      <div id="types" class="types"></div>
      <details style="margin-top:8px"><summary>Assumptions and limits</summary><ul id="notes"></ul></details>
    </section>
    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div class="seg" id="view" role="group" aria-label="What to plot">
          <button data-view="mass" class="on">Crystals and melt</button><button data-view="liquid">Melt composition</button><button data-view="minerals">Mineral compositions</button><button data-view="tas">Magma types</button><button data-view="bowen">Bowen's series</button>
        </div>
        <span id="axisnote" class="hint"></span>
      </div>
      <div id="legend" class="legend"></div>
      <div id="plot" class="plotwrap"></div>
      <div id="bowen" style="display:none"></div>
    </section>
    <section class="panel">
      <h2 style="margin-bottom:8px">Step by step</h2>
      <div class="tablewrap"><table class="steps" id="table"></table></div>
    </section>
  </div>
</main>
<script src="/static/common.js"></script>
<script src="/static/plot.js"></script>
<script src="/static/results.js"></script>
</body>
</html>
